<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #a8dadc, #457b9d); /* Tonos suaves de verde azulado y azul */
            min-height: 100vh;
            font-family: 'Roboto', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: inherit;
            filter: blur(10px);
            z-index: -1;
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(69, 123, 157, 0.4); /* Sombra azul */
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 2;
            max-width: 400px;
            width: 90%;
            padding: 40px 30px;
            text-align: center;
        }

        .form-control {
            border: none;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            color: #343a40; /* Gris oscuro para el texto */
            transition: background-color 0.3s ease;
        }
        .form-control::placeholder {
            color: rgba(52, 58, 64, 0.7); /* Gris más claro para el placeholder */
        }
        .form-control:focus {
            box-shadow: none;
            background-color: rgba(255, 255, 255, 0.4);
            border: none;
        }

        .input-group-text {
            background: transparent;
            border: none;
            color: #e63946; /* Rosa vibrante para acentos */
            border-radius: 12px 0 0 12px;
            padding-right: 0;
        }

        .btn-primary {
            background: #f1faee; /* Beige claro para el botón */
            color: #1d3557; /* Azul oscuro para el texto del botón */
            border: none;
            border-radius: 12px;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background 0.3s ease;
            width: 100%;
        }
        .btn-primary:hover {
            background: #f8f9fa; /* Gris muy claro al pasar el mouse */
        }

        .profile-icon-wrapper {
            position: absolute;
            top: -45px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 90px;
            background-color: #457b9d; /* Azul */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .profile-icon {
            color: #fff;
            font-size: 3.5rem;
        }

        .form-label {
            color: #f1faee; /* Beige claro para las etiquetas */
            margin-bottom: 5px;
            font-weight: normal;
            text-align: left;
            display: block;
        }

        .forgot-password-link { /* Solo queda este selector */
            color: #f1faee; /* Beige claro para el texto */
            font-size: 0.9rem;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        /* Eliminados los estilos para .form-check-input y .form-check-label */

        .forgot-password-link:hover {
            color: #f8f9fa; /* Gris muy claro al pasar el mouse */
        }

        .card .text-center img.logo,
        .card .text-center h2.mb-4,
        .divider,
        .social-login {
            display: none;
        }

        p.mt-3.text-center {
            color: #f1faee; /* Beige claro para el texto */
            font-size: 0.9rem;
        }
        p.mt-3.text-center a {
            color: #e63946 !important; /* Rosa vibrante */
            text-decoration: none;
        }
        p.mt-3.text-center a:hover {
            color: #f8f9fa !important; /* Gris muy claro al pasar el mouse */
        }

    </style>
</head>
<body>
    <div class="login-container">
        <div class="card">
            <div class="profile-icon-wrapper">
                <i class="fa fa-user profile-icon"></i>
            </div>
            <div class="text-center">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Logo" class="logo">
                <h2 class="mb-4 fw-bold" style="color:#1d3557;">Iniciar Sesión</h2>
            </div>
            <form action="{{ url_for('login') }}" method="post" class="mt-5 pt-3">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo Electrónico</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Tu correo electrónico" required>
                    </div>
                </div>
                <div class="mb-4"> <label for="contraseña" class="form-label">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa fa-lock"></i></span>
                        <input type="password" class="form-control" id="contraseña" name="contraseña" placeholder="Tu contraseña" required>
                    </div>
                </div>
                <div class="d-flex justify-content-end align-items-center mb-4"> <div>
                        <a href="#" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                </div>
            </form>
            <div class="divider"></div>
            <div class="social-login mb-3">
                <a href="#" title="Iniciar con Google"><i class="fab fa-google"></i></a>
                <a href="#" title="Iniciar con Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="#" title="Iniciar con Twitter"><i class="fab fa-twitter"></i></a>
            </div>
            <p class="mt-3 text-center">¿No tienes una cuenta? <a href="{{ url_for('registro') }}" class="text-decoration-none" style="color:#e63946;">Regístrate aquí</a>.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
