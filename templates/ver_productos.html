<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Productos Disponibles</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(to right, #e0f7fa, #e1f5fe);
            min-height: 100vh;
            padding-bottom: 40px;
        }

        .product-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .product-card {
            background-color: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            width: 220px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            margin-bottom: 12px;
        }

        .product-card h5 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .product-card p {
            margin-bottom: 6px;
        }

        .top-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .product-card input[type="checkbox"] {
            accent-color: #28a745;
            transform: scale(1.2);
            margin-bottom: 10px;
        }

        .cantidad-input {
            margin-bottom: 10px;
        }

        @media (max-width: 992px) {
            .product-card {
                width: 45%;
            }
        }

        @media (max-width: 576px) {
            .product-card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<div class="container">

<form action="{{ url_for('agregar_seleccionados_al_carrito') }}" method="POST">

    <div class="top-buttons">

        <button type="submit" class="btn btn-warning">
            Agregar al Carrito
        </button>

        <a href="{{ url_for('ver_carrito') }}" class="btn btn-primary">
            Ver Carrito
        </a>

        <a href="{{ url_for('ver_pedidos') }}" class="btn btn-info">
            Ver Pedidos
        </a>

        <a href="{{ url_for('logout') }}" class="btn btn-danger">
            Cerrar Sesión
        </a>

    </div>

    <h1 class="mt-4 mb-4 text-center">
        Productos Disponibles
    </h1>

    <div class="product-grid">

        {% for producto in productos %}

        <div class="product-card">

            <input type="checkbox"
                   name="productos"
                   value="{{ producto[0] }}">

            <input type="number"
                   name="cantidad_{{ producto[0] }}"
                   value="1"
                   min="1"
                   class="form-control cantidad-input">

            <img src="{{ url_for('static', filename='images/' ~ producto[5]) }}"
                 alt="{{ producto[1] }}">

            <h5>{{ producto[1] }}</h5>

            <p>{{ producto[2] }}</p>

            <p>
                <strong>Precio:</strong>
                ${{ producto[3] }}
            </p>

            <p>
                <strong>Stock:</strong>
                {{ producto[4] }}
            </p>

            <p>
                <strong>Estado:</strong>
                {{ 'Agotado' if producto[7] == 'agotado' else 'Disponible' }}
            </p>

            <input type="hidden"
                   name="precio_{{ producto[0] }}"
                   value="{{ producto[3] }}">

        </div>

        {% endfor %}

    </div>

    <div class="text-center mt-4">

    <button type="submit"
            formaction="{{ url_for('crear_pedido') }}"
            class="btn btn-success">
        Pedido Directo
    </button>

    <a href="{{ url_for('cliente_dashboard') }}"
       class="btn btn-secondary">
        Atrás
    </a>

</form>

</div>

</div>

</body>
</html>
